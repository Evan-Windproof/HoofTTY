timeout: 10
serial: yes

/HoofTTY OS - 800x600 (Default)
    protocol: limine
    path: boot():/boot/kernseed.elf
    resolution: 800x600x32

/HoofTTY OS - 640x480
    protocol: limine
    path: boot():/boot/kernseed.elf
    resolution: 640x480x32

/HoofTTY OS - 1024x768
    protocol: limine
    path: boot():/boot/kernseed.elf
    resolution: 1024x768x32

/HoofTTY OS - 1280x720
    protocol: limine
    path: boot():/boot/kernseed.elf
    resolution: 1280x720x32
